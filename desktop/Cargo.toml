[package]
name = "prdeck-desktop"
version = "0.1.0"
edition = "2024"
description = "PR Deck desktop app: a GPUI front-end over prdeck's Go core"
publish = false

[dependencies]
gpui-kit = { version = "0.9.0", features = ["syntect"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Debug info for dependencies is most of target/ (GPUI is large); keep it for our
# own code only, so a debug build takes a fraction of the disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[features]
# `cargo run --features snapshot -- --demo --snapshot out.png [--state palette]` saves
# the window as a PNG and quits. Used for the README screenshots.
snapshot = ["dep:gpui_macos", "gpui_macos/test-support"]

# Compile Metal shaders when the app starts, so building needs no Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.11", features = ["runtime_shaders"] }
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.11", optional = true }
